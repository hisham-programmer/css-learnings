<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Layout</title>
    <link rel='stylesheet' href='./layout.css'>
</head>
<body>
    <h1>Two Column Layout</h1>
    <div class="container">
        <div class="sidebar">
             <h2>Sidebar</h2>
             <p>Menu or short information goes here.</p>
        </div>
        <div class="column-content">
            <h2>Main Content</h2>
            <p>On screens 768px and wider, the sidebar and content appear side by side. On smaller screens, they stack vertically.

            Resize the browser window to see the change
            </p>
        </div>
    </div>
    <br>
    <header>@2026 My Website</header>
</body>
</html>
